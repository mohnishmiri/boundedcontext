# Local development stack — no GitHub or Copilot credentials needed.
#
#   scripts/start.sh                    (picks free ports, waits until healthy, prints the URLs)
#   scripts/stop.sh                     (--wipe also deletes the database and dev secrets)
#
# Plain compose works too: `docker compose up --build`, then open http://localhost:3000 and sign in through the
# mock GitHub (e.g. as "octocat"). Host ports can be moved if they are taken: BCP_PG_PORT, BCP_API_PORT,
# BCP_UI_PORT, BCP_MOCK_PORT (BCP_PUBLIC_URL must then match the UI port, e.g. http://localhost:3001).
#
# Components: PostgreSQL, mock GitHub (OAuth + REST, seeded fixtures), API, worker running the *fake* Copilot
# CLI, and the frontend (nginx). Everything here is for development only; see docs/local-development.md for
# running against real GitHub / Copilot.

name: bounded-context-portal

x-backend-env: &backend-env
  BCP_DATABASE_URL: postgres://bcp:bcp@postgres:5432/bcp
  BCP_PUBLIC_URL: ${BCP_PUBLIC_URL:-http://localhost:3000}
  # Uses real GitHub (https://api.github.com / https://github.com) by default.
  # Supports GitHub Personal Access Token (BCP_GITHUB_PAT or GITHUB_TOKEN in .env or browser sign-in prompt).
  BCP_GITHUB_PAT: ${BCP_GITHUB_PAT:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  BCP_USE_MOCK_GITHUB: ${BCP_USE_MOCK_GITHUB:-false}
  BCP_GITHUB_API_URL: ${BCP_GITHUB_API_URL:-http://mock-github:9000}
  BCP_GITHUB_OAUTH_URL: ${BCP_GITHUB_OAUTH_URL:-http://mock-github:9000}
  BCP_GITHUB_WEB_URL: ${BCP_GITHUB_WEB_URL:-http://localhost:${BCP_MOCK_PORT:-9000}}
  BCP_GITHUB_APP_ID: ${BCP_GITHUB_APP_ID:-4242}
  BCP_GITHUB_APP_SLUG: ${BCP_GITHUB_APP_SLUG:-bounded-context-portal-dev}
  BCP_GITHUB_CLIENT_ID: ${BCP_GITHUB_CLIENT_ID:-Iv1.localdev}
  BCP_GITHUB_CLIENT_SECRET: ${BCP_GITHUB_CLIENT_SECRET:-local-dev-secret}
  BCP_GITHUB_PRIVATE_KEY: ${BCP_GITHUB_PRIVATE_KEY:-}
  BCP_GITHUB_PRIVATE_KEY_FILE: ${BCP_GITHUB_PRIVATE_KEY_FILE:-/secrets/github-app-private-key}
  BCP_TOKEN_ENCRYPTION_KEY_FILE: /secrets/token-encryption-key
  BCP_MODELS_SHOW_UNVERIFIED: "true"
  BCP_CENTRAL_REPO: ${BCP_CENTRAL_REPO:-}
  BCP_LOG_FORMAT: pretty
  RUST_LOG: info,bcp_api=debug,bcp_worker=debug,sqlx=warn

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bcp
      POSTGRES_PASSWORD: bcp
      POSTGRES_DB: bcp
    ports: ["127.0.0.1:${BCP_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcp -d bcp"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Generates a throwaway GitHub App key and token-encryption key once (kept in the dev-secrets volume).
  dev-secrets:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev-tools
      args:
        CORPORATE_CA_CERT_ENABLED: ${BCP_CA_CERT_FILE:+1}
      secrets:
        - corporate_ca
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -s /secrets/github-app-private-key ] || openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /secrets/github-app-private-key
        [ -s /secrets/token-encryption-key ] || openssl rand -base64 32 > /secrets/token-encryption-key
        chmod 0444 /secrets/*
    volumes: [devsecrets:/secrets]

  mock-github:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev-tools
      args:
        CORPORATE_CA_CERT_ENABLED: ${BCP_CA_CERT_FILE:+1}
      secrets:
        - corporate_ca
    environment:
      MOCK_GITHUB_LISTEN: 0.0.0.0:9000
      MOCK_GITHUB_PUBLIC_URL: http://localhost:${BCP_MOCK_PORT:-9000}
    ports: ["127.0.0.1:${BCP_MOCK_PORT:-9000}:9000"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
      args:
        CORPORATE_CA_CERT_ENABLED: ${BCP_CA_CERT_FILE:+1}
      secrets:
        - corporate_ca
    environment:
      <<: *backend-env
      BCP_COOKIE_SECURE: "false"
      BCP_RUN_MIGRATIONS: "true"
      BCP_RATE_LIMIT_PER_MINUTE: "600"
      BCP_JOB_CREATE_LIMIT_PER_HOUR: "200"
      # Models each user can use are listed from the Copilot API when the portal talks to real GitHub. Against
      # the mock, set this to http://mock-github:9000/copilot to exercise the live path (otherwise the catalog).
      BCP_COPILOT_API_URL: ${BCP_COPILOT_API_URL:-}
      # Only whether a shared token is set; the token itself stays with the worker.
      BCP_COPILOT_SHARED_TOKEN: ${BCP_COPILOT_GITHUB_TOKEN:+true}
    ports: ["127.0.0.1:${BCP_API_PORT:-8080}:8080"]
    volumes:
      - devsecrets:/secrets:ro
      - ./agent-bundle:/opt/agent-bundle:ro
      - ./config/models.yaml:/etc/bcp/models.yaml:ro
      - ./config/generators.yaml:/etc/bcp/generators.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
      dev-secrets: { condition: service_completed_successfully }
      mock-github: { condition: service_started }

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker-dev
      args:
        CORPORATE_CA_CERT_ENABLED: ${BCP_CA_CERT_FILE:+1}
      secrets:
        - corporate_ca
    environment:
      <<: *backend-env
      BCP_COPILOT_BIN: ${BCP_COPILOT_BIN:-/usr/local/bin/fake-copilot}
      BCP_COPILOT_GITHUB_TOKEN: ${BCP_COPILOT_GITHUB_TOKEN:-}
      BCP_MAX_JOB_TIMEOUT_SECS: ${BCP_MAX_JOB_TIMEOUT_SECS:-18000}
      BCP_WORKER_CONCURRENCY: "2"
      BCP_GENERATE_MAX_ATTEMPTS: "1"
    read_only: true
    # exec: Copilot CLI extracts and loads a native addon under the per-job HOME in /work.
    tmpfs: ["/work:uid=10001,gid=10001,mode=0700,exec", "/tmp:mode=1777", "/home/worker:uid=10001,gid=10001,mode=0700"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - devsecrets:/secrets:ro
      - ./agent-bundle:/opt/agent-bundle:ro
      - ./config/models.yaml:/etc/bcp/models.yaml:ro
    depends_on:
      api: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      args:
        CORPORATE_CA_CERT_ENABLED: ${BCP_CA_CERT_FILE:+1}
      secrets:
        - corporate_ca
    environment:
      API_UPSTREAM: http://api:8080
    ports: ["127.0.0.1:${BCP_UI_PORT:-3000}:8080"]
    depends_on: [api]

volumes:
  pgdata:
  devsecrets:

secrets:
  corporate_ca:
    file: ${BCP_CA_CERT_FILE:-./.env.example}
