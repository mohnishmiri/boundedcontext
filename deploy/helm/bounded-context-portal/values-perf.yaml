# Perf: https://ragaflow-boundedcontext.test.att.com  (deploy here first, then values-prod.yaml)
# Production-like sizing so perf results carry over to prod.
#
# Values marked REQUIRED are specific to the cluster/subscription. They are deliberately empty so `helm upgrade`
# stops with a clear message instead of deploying placeholders. Pass them with --set or a private values file
# (they are identifiers, not secrets). Set image tags per release (--set api.image.tag=... etc.).

global:
  # JFrog: pushed to artifact.it.att.com/<path> (no port), pulled through the :22609 docker endpoint.
  imageRegistry: artifact.it.att.com:22609/apm0014313-dkr-attcc-stage/com.att.attcc
  # kubectl -n bounded-context create secret docker-registry regcred --docker-server=artifact.it.att.com:22609 ...
  imagePullSecrets:
    - name: regcred

image:
  pullPolicy: IfNotPresent

config:
  # Must be the exact browser URL (scheme + ingress.host): the API rejects writes from any other origin (CSRF).
  publicUrl: https://ragaflow-boundedcontext.test.att.com
  databaseMaxConnections: 10
  github:
    apiUrl: https://api.github.com
    webUrl: https://github.com
    # Users sign in with a personal access token (no OAuth App / GitHub App). To enable OAuth sign-in set clientId
    # (plus Key Vault github-client-secret); callback: https://ragaflow-boundedcontext.test.att.com/api/auth/github/callback
    appId: ""
    appSlug: RagaFlow-Bounded-Context
    clientId: ""
  rustLog: "info,sqlx=warn"
  modelsShowUnverified: false
  adminLogins:
    - mz7819_ATT,bs9697_ATT
  extraEnv:
    BCP_CENTRAL_REPO: ATT-DP1/apm0014313-ragaflow-ai-context-docs
  otel:
    endpoint: ""                            # e.g. http://otel-collector.monitoring:4317
  # GitHub/Copilot traffic from the api and worker pods goes through the cluster proxy (allow-listed egress IP).
  proxy:
    http: http://proxy.conexus.svc.local:3128
    https: http://proxy.conexus.svc.local:3128
  # Completion emails. The password is Key Vault secret smtp-password (az keyvault secret set --name smtp-password ...).
  smtp:
    host: mta01.az.3pc.att.com
    port: 19828
    user: m55663-ap@mta01.att-mail.com
    fromAddress: m55663-ap@mta01.att-mail.com
    useTls: true
    fallbackDomain: att.com

secrets:
  # akv2k8s syncs the Key Vault secrets into Kubernetes Secrets (no pod identity needed).
  mode: akv2k8s
  # Every job uses the requester's own Copilot token and credits.
  copilotSharedToken: false
  keyVault:
    name: "attcc-eastus2-perf-kv"                                # REQUIRED: Perf Key Vault holding database-url and token-encryption-key

workloadIdentity:
  podLabel: false

api:
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 8, targetCPUUtilizationPercentage: 65 }
  pdb: { enabled: true, minAvailable: 2 }
  resources:
    requests: { cpu: 200m, memory: 192Mi }
    limits: { cpu: "1", memory: 512Mi }
  env:
    BCP_SESSION_TTL_HOURS: "12"
    BCP_COOKIE_SECURE: "true"
    BCP_RATE_LIMIT_PER_MINUTE: "120"
    BCP_JOB_CREATE_LIMIT_PER_HOUR: "20"
    BCP_RUN_MIGRATIONS: "false"             # the pre-install/pre-upgrade hook migrates
    BCP_JOB_RETENTION_DAYS: "90"

worker:
  mode: once
  scaledJob:
    maxReplicaCount: 20
    activeDeadlineSeconds: 18600
  env:
    BCP_MAX_JOB_TIMEOUT_SECS: "18000"
    # Large monorepos (e.g. apm0010052-opus-opusdev) unpack to more than 500 MiB. Keep workDir.sizeLimit and
    # ephemeral-storage above ~2x this (tarball + extracted tree).
    BCP_MAX_REPO_BYTES: "2147483648"
    BCP_MAX_REPO_FILES: "300000"
    BCP_TASK_LEASE_SECS: "60"
    BCP_GENERATE_MAX_ATTEMPTS: "2"
    BCP_PUBLISH_MAX_ATTEMPTS: "5"
    BCP_SHUTDOWN_GRACE_SECS: "60"
    BCP_IDLE_EXIT_SECS: "60"
    BCP_MAX_LOG_LINES: "5000"
  workDir:
    sizeLimit: 10Gi
  resources:
    requests: { cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi }
    limits: { cpu: "2", memory: 4Gi, ephemeral-storage: 14Gi }

frontend:
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }

keda:
  enabled: true

metrics:
  podMonitor:
    enabled: true

ingress:
  host: ragaflow-boundedcontext.test.att.com
  tls:
    enabled: true
    # REQUIRED (one of): Key Vault certificate name synced by akv2k8s, Key Vault certificate id for the app
    # routing add-on, or an existing TLS secret in the namespace.
    akv2k8sCertName: "ragaflow-boundedcontext"
    keyVaultCertUri: ""
    secretName: ""

networkPolicy:
  enabled: false
  proxy:
    enabled: true             # allow egress to proxy.conexus (port 3128) once policies are enabled
  postgres:
    # Perf DB attcc-eastus2-prf1-db-psqlfs.postgres.database.azure.com resolves to 135.170.109.97 (public access).
    # Re-check from inside the cluster (`nslookup` in a pod); with private access use its delegated subnet.
    cidrs: ["135.170.109.97/32"]
  # Hostname-based egress needs Azure CNI powered by Cilium + Advanced Container Networking Services; enable
  # once the cluster has them (verify copilotFqdnPatterns first). Plain NetworkPolicies still apply meanwhile.
  cilium:
    enabled: false
