{{- if .Values.api.enabled }}
{{- $a := .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bcp.fullname" . }}-api
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  {{- if not $a.autoscaling.enabled }}
  replicas: {{ $a.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "bcp.componentSelectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bcp.componentLabels" (dict "ctx" $ "component" "api") | nindent 8 }}
        {{- with (include "bcp.podIdentityLabels" . | trim) }}{{ . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
        {{- include "bcp.sharedChecksums" . | nindent 8 }}
        {{- with (include "bcp.metricsAnnotations" (dict "ctx" $ "port" 9090) | trim) }}{{ . | nindent 8 }}{{- end }}
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.api.name }}
      automountServiceAccountToken: false
      {{- with (include "bcp.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{- end }}
      securityContext:
        {{- include "bcp.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- with (include "bcp.topologySpread" (dict "ctx" $ "component" "api") | trim) }}{{ . | nindent 6 }}{{- end }}
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "bcp.image" (dict "ctx" $ "image" $a.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: {{ include "bcp.fullname" . }}-api
          env:
            {{- include "bcp.secretFileEnv" (dict "ctx" $ "all" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Give the ingress controller time to drop the endpoint before SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          securityContext:
            {{- include "bcp.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with (include "bcp.overrideVolumeMounts" . | trim) }}{{ . | nindent 12 }}{{- end }}
      volumes:
        {{- include "bcp.secretVolume" (dict "ctx" $ "component" "api") | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- with (include "bcp.overrideVolumes" . | trim) }}{{ . | nindent 8 }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bcp.fullname" . }}-api
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bcp.componentSelectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
{{- if $a.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bcp.fullname" . }}-api
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "bcp.fullname" . }}-api
  minReplicas: {{ $a.autoscaling.minReplicas }}
  maxReplicas: {{ $a.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $a.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bcp.fullname" . }}-api
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ $a.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "bcp.componentSelectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
{{- end }}
{{- end }}
