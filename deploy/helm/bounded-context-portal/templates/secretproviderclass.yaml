{{- if eq .Values.secrets.mode "csi" }}
{{- $kv := .Values.secrets.keyVault }}
{{- $o := $kv.objects }}
{{- if .Values.api.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "bcp.fullname" . }}-api
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  provider: azure
  {{- if and .Values.keda.enabled (not .Values.keda.connectionSecret.name) }}
  # Synced while at least one api pod mounts this class (api always runs), so KEDA can read the connection
  # string even when no worker pods exist (once mode).
  secretObjects:
    - secretName: {{ include "bcp.syncedDbSecretName" . }}
      type: Opaque
      labels:
        {{- include "bcp.labels" . | nindent 8 }}
      data:
        - objectName: {{ $o.databaseUrl }}
          key: {{ .Values.keda.connectionSecret.key }}
  {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "serviceAccounts.api.clientId is required for secrets.mode=csi" .Values.serviceAccounts.api.clientId | quote }}
    keyvaultName: {{ required "secrets.keyVault.name is required for secrets.mode=csi" $kv.name | quote }}
    tenantId: {{ required "secrets.keyVault.tenantId is required for secrets.mode=csi" $kv.tenantId | quote }}
    objects: |
      {{- include "bcp.spcObjects" (dict "names" (list $o.databaseUrl $o.githubClientSecret $o.githubAppPrivateKey $o.tokenEncryptionKey)) | nindent 6 }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "bcp.fullname" . }}-worker
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "worker") | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "serviceAccounts.worker.clientId is required for secrets.mode=csi" .Values.serviceAccounts.worker.clientId | quote }}
    keyvaultName: {{ $kv.name | quote }}
    tenantId: {{ $kv.tenantId | quote }}
    objects: |
      {{- include "bcp.spcObjects" (dict "names" (list $o.databaseUrl $o.githubClientSecret $o.githubAppPrivateKey $o.tokenEncryptionKey)) | nindent 6 }}
{{- end }}
{{- end }}
