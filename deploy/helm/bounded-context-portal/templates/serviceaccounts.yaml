{{- if .Values.api.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api.name }}
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  {{- with .Values.serviceAccounts.api.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.worker.name }}
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "worker") | nindent 4 }}
  {{- with .Values.serviceAccounts.worker.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.frontend.enabled }}
---
# The frontend needs no Azure identity; a dedicated SA keeps it off the namespace default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bcp.fullname" . }}-frontend
  labels:
    {{- include "bcp.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
