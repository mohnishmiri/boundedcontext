{{- if eq .Values.secrets.mode "akv2k8s" }}
{{- /*
akv2k8s (https://akv2k8s.io): the controller syncs each Key Vault object into its own Kubernetes Secret
(<fullname>-<object>, key = object name); pods mount them as files via a projected volume (bcp.secretVolume).
The controller's identity needs Get on secrets (and certificates when ingress.tls.akv2k8sCertName is set).
*/}}
{{- $kv := required "secrets.keyVault.name is required for secrets.mode=akv2k8s" .Values.secrets.keyVault.name }}
{{- $names := include "bcp.secretObjectNames" (dict "ctx" $ "component" "api") | fromJsonArray }}
{{- if .Values.worker.enabled }}
{{- $names = concat $names (include "bcp.secretObjectNames" (dict "ctx" $ "component" "worker") | fromJsonArray) }}
{{- end }}
{{- range $i, $obj := uniq $names }}
{{- if $i }}
---
{{- end }}
apiVersion: {{ $.Values.secrets.akv2k8s.apiVersion }}
kind: AzureKeyVaultSecret
metadata:
  name: {{ include "bcp.akvSecretName" (dict "ctx" $ "object" $obj) }}
  labels:
    {{- include "bcp.labels" $ | nindent 4 }}
spec:
  vault:
    name: {{ $kv | quote }}
    object:
      name: {{ $obj | quote }}
      type: secret
  output:
    secret:
      name: {{ include "bcp.akvSecretName" (dict "ctx" $ "object" $obj) }}
      dataKey: {{ $obj | quote }}
{{- end }}
{{- with .Values.ingress.tls.akv2k8sCertName }}
{{- if and $.Values.ingress.enabled $.Values.ingress.tls.enabled (not $.Values.ingress.tls.keyVaultCertUri) }}
---
apiVersion: {{ $.Values.secrets.akv2k8s.apiVersion }}
kind: AzureKeyVaultSecret
metadata:
  name: {{ include "bcp.fullname" $ }}-tls
  labels:
    {{- include "bcp.labels" $ | nindent 4 }}
spec:
  vault:
    name: {{ $kv | quote }}
    object:
      name: {{ . | quote }}
      type: certificate
  output:
    secret:
      name: {{ include "bcp.fullname" $ }}-tls
      type: kubernetes.io/tls
{{- end }}
{{- end }}
{{- end }}
