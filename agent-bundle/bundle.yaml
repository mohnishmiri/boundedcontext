# Agent bundle manifest — installed from https://github.com/mohnishmiri/bounded-context-generator
# (aifc-archetype-generator/orchestrate.agent.md + prompts/universal-bounded-context.prompt.md)

schema_version: 1

placeholder: false

agent:
  id: orchestrate
  display_name: AIFC Archetype & Bounded Context Orchestrator
  description: >-
    Standalone orchestrator that generates a LEAN or FULL AIFC archetype pack plus a 9-section
    evidence-backed Bounded Context document (docs/BOUNDED-CONTEXT-<service>.md) for any service or codebase.

prompt:
  template: |
    You are the `orchestrate` agent. Run the procedure yourself in this session; do not delegate the whole run to another `orchestrate` agent.
    Run the archetype orchestrator for:
      MS_ROOT_PATH = {{workspace}}{{#scope_path}}/{{scope_path}}{{/scope_path}}
      SERVICE_NAME = {{repo}}
      ARCHETYPE_PROFILE = {{archetype_profile}}
    The generator workspace (where `prompts/` lives) is `{{agent_dir}}`: read `{{agent_dir}}/prompts/universal-bounded-context.prompt.md` and `{{agent_dir}}/prompts/batch-subagent.prompt.md` from there. It is read-only; write nothing there.
    Generate the {{archetype_profile}} archetype pack under `docs/archetypes/` and the bounded context document at `docs/BOUNDED-CONTEXT-{{repo}}.md` inside MS_ROOT_PATH.

inputs:
  - name: archetype_profile
    label: Archetype profile
    help: FULL generates all 16 standalone archetypes + index + summary + bounded-context doc; LEAN generates 4 merged archetypes + index + summary + bounded-context doc.
    kind: select
    required: false
    choices:
      - FULL
      - LEAN
    default: FULL
  - name: scope_path
    label: Subdirectory (MS_ROOT_PATH)
    help: Leave empty to analyse the repository root, or enter a subfolder path for a monorepo microservice.
    kind: path
    required: false
    default: ""
    max_length: 200

output:
  paths:
    - docs/BOUNDED-CONTEXT-*.md
    - docs/bounded-context.md
    - docs/bounded-contexts/*.md
    - docs/archetypes/*.md
    - docs/archetypes/*.yaml
    - docs/archetypes/04-ADRs/*.md
    - "**/docs/BOUNDED-CONTEXT-*.md"
    - "**/docs/bounded-contexts/*.md"
    - "**/docs/archetypes/*.md"
    - "**/docs/archetypes/*.yaml"
    - "**/docs/archetypes/04-ADRs/*.md"
  min_bytes: 64
  max_bytes: 2097152

runtime:
  timeout_secs: 18000
  allow_tools: [read, write]
  deny_tools: [shell, url, memory]
  disable_mcp_servers: [github-mcp-server]
  repository_instructions: false
